<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="50%" stop-color="#0e0a24"/>
      <stop offset="100%" stop-color="#0f1429"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Quilt patch background pattern -->
    <pattern id="quiltBg" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
      <rect x="30" y="0" width="30" height="30" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.06"/>
      <rect x="0" y="30" width="30" height="30" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.06"/>
      <rect x="30" y="30" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Subtle background blobs -->
    <filter id="blob">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Quilt background pattern -->
  <rect width="1280" height="640" fill="url(#quiltBg)"/>

  <!-- Subtle ambient color blobs -->
  <ellipse cx="320" cy="300" rx="360" ry="280" fill="#6366f1" opacity="0.08" filter="url(#blob)"/>
  <ellipse cx="960" cy="200" rx="300" ry="240" fill="#06b6d4" opacity="0.06" filter="url(#blob)"/>
  <ellipse cx="800" cy="500" rx="240" ry="180" fill="#818cf8" opacity="0.05" filter="url(#blob)"/>

  <!-- Subtle accent line top -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#iconGrad)"/>

  <!-- === App Icon: 2×2 quilt patch grid === -->
  <g transform="translate(200, 183)">
    <!-- Top-left patch (opacity 1.0) -->
    <rect x="0" y="0" width="130" height="130" rx="18" fill="url(#iconGrad)" filter="url(#shadow)" opacity="1.0"/>

    <!-- Top-right patch (opacity 0.6) -->
    <rect x="144" y="0" width="130" height="130" rx="18" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.6"/>

    <!-- Bottom-left patch (opacity 0.3) -->
    <rect x="0" y="144" width="130" height="130" rx="18" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.3"/>

    <!-- Bottom-right patch (opacity 0.8) -->
    <rect x="144" y="144" width="130" height="130" rx="18" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.8"/>

    <!-- Subtle stitch lines crossing the gap -->
    <line x1="137" y1="65" x2="137" y2="137" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>
    <line x1="65" y1="137" x2="137" y2="137" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>
  </g>

  <!-- === Text Content (right side) === -->

  <!-- Title -->
  <text x="540" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#f1f5f9" letter-spacing="-2.5">Quilt</text>

  <!-- Subtitle -->
  <text x="542" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="url(#subtitleGrad)" letter-spacing="-0.3">Create beautiful image collages</text>

  <!-- Features tagline -->
  <text x="542" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#64748b" letter-spacing="0.1">drag &amp; drop · resize · crop · export</text>

  <!-- Decorative underline -->
  <rect x="542" y="423" width="100" height="4" rx="2" fill="url(#iconGrad)" opacity="0.6"/>

  <!-- Small app icon ghost in bottom-right -->
  <g transform="translate(1160, 544)" opacity="0.12">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="url(#iconGrad)" opacity="1.0"/>
    <rect x="26" y="0" width="22" height="22" rx="4" fill="url(#iconGrad)" opacity="0.6"/>
    <rect x="0" y="26" width="22" height="22" rx="4" fill="url(#iconGrad)" opacity="0.3"/>
    <rect x="26" y="26" width="22" height="22" rx="4" fill="url(#iconGrad)" opacity="0.8"/>
  </g>

  <!-- Bottom right domain -->
  <text x="1250" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="end">quilt.jfsen.org</text>
</svg>
