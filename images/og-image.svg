<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="50%" stop-color="#0e0a24"/>
      <stop offset="100%" stop-color="#0f1429"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Quilt patch background pattern -->
    <pattern id="quiltBg" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
      <rect x="30" y="0" width="30" height="30" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.06"/>
      <rect x="0" y="30" width="30" height="30" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.06"/>
      <rect x="30" y="30" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Subtle background blobs -->
    <filter id="blob">
      <feGaussianBlur stdDeviation="94"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Quilt background pattern -->
  <rect width="1200" height="630" fill="url(#quiltBg)"/>

  <!-- Subtle ambient color blobs -->
  <ellipse cx="300" cy="296" rx="338" ry="263" fill="#6366f1" opacity="0.08" filter="url(#blob)"/>
  <ellipse cx="900" cy="203" rx="281" ry="225" fill="#06b6d4" opacity="0.06" filter="url(#blob)"/>
  <ellipse cx="750" cy="484" rx="225" ry="169" fill="#818cf8" opacity="0.05" filter="url(#blob)"/>

  <!-- Subtle accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#iconGrad)"/>

  <!-- === App Icon: 2×2 quilt patch grid === -->
  <g transform="translate(188, 187)">
    <!-- Top-left patch (opacity 1.0) -->
    <rect x="0" y="0" width="122" height="122" rx="17" fill="url(#iconGrad)" filter="url(#shadow)" opacity="1.0"/>

    <!-- Top-right patch (opacity 0.6) -->
    <rect x="135" y="0" width="122" height="122" rx="17" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.6"/>

    <!-- Bottom-left patch (opacity 0.3) -->
    <rect x="0" y="135" width="122" height="122" rx="17" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.3"/>

    <!-- Bottom-right patch (opacity 0.8) -->
    <rect x="135" y="135" width="122" height="122" rx="17" fill="url(#iconGrad)" filter="url(#shadow)" opacity="0.8"/>

    <!-- Subtle stitch lines crossing the gap -->
    <line x1="128" y1="61" x2="128" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>
    <line x1="61" y1="128" x2="128" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>
  </g>

  <!-- === Text Content (right side) === -->

  <!-- Title -->
  <text x="506" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="800" fill="#f1f5f9" letter-spacing="-2.5">Quilt</text>

  <!-- Subtitle -->
  <text x="508" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="url(#subtitleGrad)" letter-spacing="-0.3">Create beautiful image collages</text>

  <!-- Features tagline -->
  <text x="508" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#64748b" letter-spacing="0.1">drag &amp; drop · resize · crop · export</text>

  <!-- Decorative underline -->
  <rect x="508" y="412" width="94" height="4" rx="2" fill="url(#iconGrad)" opacity="0.6"/>

  <!-- Small app icon ghost in bottom-right -->
  <g transform="translate(1088, 525)" opacity="0.12">
    <rect x="0" y="0" width="21" height="21" rx="4" fill="url(#iconGrad)" opacity="1.0"/>
    <rect x="24" y="0" width="21" height="21" rx="4" fill="url(#iconGrad)" opacity="0.6"/>
    <rect x="0" y="24" width="21" height="21" rx="4" fill="url(#iconGrad)" opacity="0.3"/>
    <rect x="24" y="24" width="21" height="21" rx="4" fill="url(#iconGrad)" opacity="0.8"/>
  </g>

  <!-- Bottom right domain -->
  <text x="1172" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="end">quilt.jfsen.org</text>
</svg>
